<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的记账本</title>
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    background: #f2f4f8;
}

.container {
    max-width: 500px;
    margin: auto;
}

.card {
    background: white;
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

h1 {
    margin: 0 0 15px;
    text-align: center;
}

h2 {
    margin: 0 0 10px;
    font-size: 20px;
}

.balance {
    text-align: center;
    font-size: 34px;
    font-weight: bold;
    margin: 15px 0;
}

input, select {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: 1px solid #ddd;
    border-radius: 12px;
    font-size: 16px;
    background: white;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: none;
    border-radius: 12px;
    background: #222;
    color: white;
    font-size: 17px;
}

.record {
    padding: 12px 0;
    border-bottom: 1px solid #eee;
    display: flex;
    align-items: center;
    gap: 8px;
}

.record .note {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.record .date {
    color: #999;
    font-size: 13px;
    white-space: nowrap;
}

.record .del {
    width: auto;
    padding: 6px 12px;
    margin-top: 0;
    font-size: 13px;
    background: #f1f1f1;
    color: #666;
    border-radius: 8px;
    flex-shrink: 0;
}

.income {
    color: #16a34a;
}

.expense {
    color: #dc2626;
}

.empty {
    color: #999;
    text-align: center;
    padding: 20px 0;
}
</style>
</head>

<body>

<div class="container">

<div class="card">
    <h1>💰 我的记账本</h1>
    <div>当前余额</div>
    <div class="balance" id="balance">¥0.00</div>
</div>

<div class="card">
    <select id="type">
        <option value="income">收入</option>
        <option value="expense">支出</option>
    </select>
    <input id="amount" type="number" placeholder="请输入金额">
    <input id="note" type="text" placeholder="备注，例如：吃饭">
    <button id="addBtn">添加记录</button>
</div>

<div class="card">
    <h2>📋 记账记录</h2>
    <div id="records"></div>
</div>

</div>

<script>
let records = [];
try {
    const saved = JSON.parse(localStorage.getItem("records"));
    if (Array.isArray(saved)) records = saved;
} catch (e) {
    records = [];
}

const balanceEl = document.getElementById("balance");
const recordsEl = document.getElementById("records");
const typeEl = document.getElementById("type");
const amountEl = document.getElementById("amount");
const noteEl = document.getElementById("note");

function saveRecords() {
    localStorage.setItem("records", JSON.stringify(records));
}

function calcBalance() {
    return records.reduce(function (sum, item) {
        return sum + (item.type === "income" ? item.amount : -item.amount);
    }, 0);
}

function formatDate(ts) {
    const d = new Date(ts);
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
}

function render() {
    balanceEl.innerText = "¥" + calcBalance().toFixed(2);
    recordsEl.innerHTML = "";

    if (records.length === 0) {
        recordsEl.innerHTML = '<div class="empty">暂无记录</div>';
        return;
    }

    records.forEach(function (item, index) {
        const div = document.createElement("div");
        div.className = "record";

        const cls = item.type === "income" ? "income" : "expense";
        const sign = item.type === "income" ? "＋" : "－";

        div.innerHTML =
            '<span class="' + cls + '">' + sign + "¥" + Number(item.amount).toFixed(2) + "</span>" +
            '<span class="note">' + escapeHtml(item.note) + "</span>" +
            '<span class="date">' + formatDate(item.time) + "</span>" +
            '<button class="del" data-index="' + index + '">删除</button>';

        recordsEl.appendChild(div);
    });

    recordsEl.querySelectorAll(".del").forEach(function (btn) {
        btn.addEventListener("click", function () {
            if (confirm("确定要删除这条记录吗？")) {
                records.splice(Number(btn.dataset.index), 1);
                saveRecords();
                render();
            }
        });
    });
}

document.getElementById("addBtn").addEventListener("click", function () {
    const type = typeEl.value;
    const amount = Number(amountEl.value);
    const note = noteEl.value.trim() || "未填写备注";

    if (!amount || amount <= 0) {
        alert("请输入正确的金额");
        return;
    }

    records.unshift({ type: type, amount: amount, note: note, time: Date.now() });
    saveRecords();
    render();

    amountEl.value = "";
    noteEl.value = "";
});

render();
</script>

</body>
</html>
